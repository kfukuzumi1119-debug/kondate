.kun { display: flex; align-items: flex-end; gap: 10px; }
.kun-svg { width: 92px; height: 92px; flex: none; overflow: visible; }
.kun-svg .steam { fill: none; stroke: var(--muted); stroke-width: 2.5; stroke-linecap: round; opacity: .55; }
.kun-svg .eye { transform-box: fill-box; transform-origin: center; }
.bubble {
  position: relative; flex: 1; min-width: 0; margin-bottom: 14px;

  padding: 8px 14px 10px;
}
.bubble::before {
  content: ""; position: absolute; left: -8px; bottom: 14px; width: 13px; height: 13px;

@media (prefers-reduced-motion: no-preference) {
  .kun-svg.hop { animation: hop .5s ease-out; }

  .kun-svg .steam:nth-child(2) { animation-delay: .6s; }

const RECIPES = {
  '肉じゃが': { s: ['豚こま肉 150g','じゃがいも 3個','玉ねぎ 1個','にんじん 1/2本','だし汁 300ml','しょうゆ・みりん 各大さじ2.5','砂糖 大さじ1.5','サラダ油 小さじ2'], p: ['野菜を一口大に切る。じゃがいもは水にさらす。','鍋に油を熱して豚肉を炒め、色が変わったら野菜を加えて炒める。','だし汁と調味料を入れ、落としぶたをして中火で15分煮る。','じゃがいもがやわらかくなったら火を止め、少しおいて味をなじませる。'], tip: '一度冷ますと味がしみておいしくなるよ。' },
  '豚の生姜焼き': { s: ['豚ロース薄切り 200g','玉ねぎ 1/2個','キャベツ 2枚','しょうが（すりおろし） 小さじ2','しょうゆ・みりん・酒 各大さじ1.5','砂糖 小さじ1','片栗粉 少々','サラダ油 小さじ2'], p: ['調味料としょうがを混ぜてたれを作る。キャベツはせん切り、玉ねぎは薄切りにする。','豚肉に片栗粉を薄くまぶす。','フライパンに油を熱し、玉ねぎと豚肉を焼く。','火が通ったらたれを加えて絡め、キャベツと一緒に盛る。'], tip: '片栗粉をまぶすと、たれがよく絡むよ。' },
  '豚こまともやしのポン酢炒め': { s: ['豚こま肉 150g','もやし 1袋','ポン酢 大さじ3','ごま油 小さじ2','塩こしょう 少々','小ねぎ（あれば） 少々'], p: ['豚肉に塩こしょうをふる。','フライパンにごま油を熱し、豚肉を炒める。','色が変わったらもやしを加え、強火でさっと炒める。','ポン酢を回し入れて全体に絡め、小ねぎを散らす。'], tip: 'もやしは炒めすぎないとシャキシャキだよ。' },
  '豚バラ大根': { s: ['豚バラ薄切り 150g','大根 1/3本','しょうが 1かけ','水 300ml','しょうゆ 大さじ2.5','みりん・酒 各大さじ2','砂糖 大さじ1'], p: ['大根は2cm厚のいちょう切り、豚肉は4cm幅、しょうがは薄切りにする。','鍋で豚肉を炒め、脂が出てきたら大根を加えて炒める。','水・調味料・しょうがを入れ、落としぶたをして20分煮る。','ふたを取り、汁気が少なくなるまで煮からめる。'], tip: '大根を先にレンジで5分温めておくと早く煮えるよ。' },
  '白菜と豚肉のミルフィーユ鍋': { s: ['豚バラ薄切り 200g','白菜 1/4株','きのこ 1パック','だし汁 400ml','しょうゆ・酒 各大さじ1','塩 少々','ポン酢 適量'], p: ['白菜と豚肉を交互に重ね、5cm幅に切る。','鍋に断面を上にして外側からぎゅっと詰め、すき間にきのこを入れる。','だし汁と調味料を注ぎ、ふたをして中火で15分煮る。','ポン酢をつけていただく。'], tip: 'すき間なく詰めると煮くずれしにくいよ。' },
  '鶏の照り焼き': { s: ['鶏もも肉 1枚（300g）','しょうゆ・みりん・酒 各大さじ2','砂糖 小さじ2','サラダ油 小さじ1'], p: ['鶏肉の厚い部分を開き、皮にフォークで穴をあける。','フライパンに油を熱し、皮目から中火で焼く。焼き色がついたら返し、ふたをして5分焼く。','出てきた余分な脂をキッチンペーパーでふき取る。','調味料を加え、とろみが出るまで煮からめる。食べやすく切って盛る。'], tip: '脂をふき取ると、たれがしっかり絡むよ。' },
  '鶏の唐揚げ': { s: ['鶏もも肉 1枚（300g）','しょうゆ 大さじ1.5','酒 大さじ1','しょうが・にんにく（すりおろし） 各小さじ1','片栗粉 大さじ4','揚げ油 適量'], p: ['鶏肉を一口大に切り、調味料をもみ込んで15分おく。','片栗粉をまぶす。','170℃の油で4分揚げて取り出し、4分休ませる。','190℃の油で1分揚げる。'], tip: '二度揚げすると外はカリッと、中はジューシーだよ。' },
  '親子丼': { s: ['鶏もも肉 150g','玉ねぎ 1/2個','卵 3個','ごはん 2杯','だし汁 150ml','しょうゆ・みりん 各大さじ2','砂糖 小さじ2'], p: ['鶏肉は小さめの一口大、玉ねぎは薄切りにする。','小さめのフライパンにだし汁と調味料を煮立て、鶏肉と玉ねぎを5分煮る。','溶き卵を2回に分けて回し入れ、半熟になったら火を止める。','ごはんにのせる。'], tip: '卵は混ぜすぎないと、ふわとろになるよ。' },
  '鶏と大根の煮物': { s: ['鶏もも肉 1枚','大根 1/3本','しょうが 1かけ','水 300ml','しょうゆ 大さじ2.5','みりん・酒 各大さじ2','砂糖 大さじ1','サラダ油 小さじ1'], p: ['鶏肉は一口大、大根は乱切り、しょうがは薄切りにする。','鍋に油を熱し、鶏肉を皮目から焼く。','大根を加えて炒め、水・調味料・しょうがを入れる。','落としぶたをして20分煮る。'] },
  '牛丼': { s: ['牛こま肉 200g','玉ねぎ 1個','ごはん 2杯','だし汁 200ml','しょうゆ 大さじ3','みりん・酒 各大さじ2','砂糖 大さじ1','紅しょうが（お好みで）'], p: ['玉ねぎは1cm幅のくし形に切る。','鍋にだし汁と調味料を煮立て、玉ねぎを5分煮る。','牛肉をほぐしながら加え、アクを取りながら5分煮る。','ごはんにのせ、紅しょうがを添える。'], tip: '牛肉は最後に入れるとかたくならないよ。' },
  '厚揚げの肉みそ炒め': { s: ['厚揚げ 1枚','豚ひき肉 100g','ピーマン 2個','みそ 大さじ1.5','砂糖・酒 各大さじ1','しょうゆ 小さじ1','ごま油 小さじ2'], p: ['厚揚げは一口大、ピーマンは乱切りにする。','調味料を混ぜておく。','ごま油でひき肉を炒め、厚揚げとピーマンを加えて炒める。','合わせた調味料を加えて全体に絡める。'] },

  'さばの味噌煮': { s: ['さば 2切れ','ねぎ 1本','しょうが 1かけ','水 150ml','酒 50ml','みそ 大さじ2','砂糖 大さじ1.5','みりん 大さじ1'], p: ['さばの皮に切れ目を入れ、熱湯を回しかけて臭みを取る。','鍋に水・酒・砂糖・みりん・薄切りしょうがを煮立て、さばを皮目を上にして入れる。','落としぶたをして8分煮る。','みそを煮汁で溶いて加え、4cmに切ったねぎを入れ、煮汁をかけながら7分煮る。'], tip: 'みそは後から入れると香りがいいよ。' },
  'ポークカレー': { s: ['豚こま肉 200g','じゃがいも 2個','玉ねぎ 1個','にんじん 1/2本','水 400ml','カレールウ 3皿分','サラダ油 大さじ1'], p: ['野菜と肉を一口大に切る。','鍋に油を熱し、肉、玉ねぎ、にんじん、じゃがいもの順に炒める。','水を加え、アクを取りながら15分煮る。','火を止めてルウを溶かし、弱火で5分、とろみがつくまで煮る。'], tip: 'ルウは火を止めてから入れるとダマにならないよ。' },
  'チキンソテー': { s: ['鶏もも肉 1枚','塩 小さじ1/3','こしょう 少々','にんにく 1かけ','オリーブ油 小さじ2','レモン（お好みで）'], p: ['鶏肉の筋を切り、塩こしょうをふる。','フライパンに油とつぶしたにんにくを入れ、鶏肉を皮目を下にして置いてから火をつける。','中火でへらで押さえながら、皮がカリッとするまで8分焼く。','返して4分焼き、レモンを添える。'], tip: '冷たいフライパンから焼くと皮がパリパリになるよ。' },
  'オムライス': { s: ['鶏もも肉 100g','玉ねぎ 1/4個','ごはん 2杯分','卵 4個','牛乳 大さじ2','ケチャップ 大さじ5＋仕上げ用','バター 20g','塩こしょう 少々'], p: ['鶏肉は小さく切り、玉ねぎはみじん切りにする。','バター半量で鶏肉と玉ねぎを炒め、ごはんとケチャップを加えて炒め、塩こしょうで味をととのえる。','1人分ずつ、卵2個と牛乳大さじ1を溶いて残りのバターで半熟に焼く。','チキンライスをのせて包み、ケチャップをかける。'], tip: '包むのが難しかったら、ごはんにのせるだけでもおいしいよ。' },
  'チキンのトマト煮': { s: ['鶏もも肉 1枚','玉ねぎ 1/2個','きのこ 1/2パック','トマト 2個（カットトマト缶1缶でも）','にんにく 1かけ','コンソメ 小さじ1','塩こしょう 少々','オリーブ油 大さじ1'], p: ['鶏肉を一口大に切って塩こしょうをふる。玉ねぎは薄切り、トマトはざく切りにする。','オリーブ油でにんにくを炒め、鶏肉を焼き色がつくまで焼く。','玉ねぎときのこを炒め、トマトとコンソメを加える。','ふたをして15分煮て、塩こしょうで味をととのえる。'] },
  'ハンバーグ': { s: ['合いびき肉 250g','玉ねぎ 1/2個','卵 1個','パン粉 大さじ4','牛乳 大さじ3','塩 小さじ1/3','こしょう・ナツメグ 少々','ケチャップ 大さじ3','ソース 大さじ2','サラダ油 小さじ1'], p: ['玉ねぎをみじん切りにし、レンジで2分加熱して冷ます。','ひき肉と塩を粘りが出るまで練り、残りの材料（ケチャップ・ソース以外）を混ぜる。','2等分して空気を抜き、小判形にして中央をくぼませる。','中火で両面に焼き色をつけ、水大さじ3を入れてふたをし、弱火で8分焼く。','フライパンに残った肉汁にケチャップとソースを加えて煮立て、ソースにする。'], tip: '真ん中をくぼませると、ふっくら焼けるよ。' },
  'ロールキャベツ': { s: ['キャベツの葉 6枚','合いびき肉 200g','玉ねぎ 1/4個','卵 1個','パン粉 大さじ3','塩こしょう 少々','水 400ml','コンソメ 小さじ2'], p: ['キャベツの葉をゆで、芯の厚い部分をそぐ。','ひき肉、みじん切りの玉ねぎ、卵、パン粉、塩こしょうを練り、6等分する。','キャベツで肉だねを包む。','巻き終わりを下にして鍋に並べ、水とコンソメを入れて落としぶたをし、30分煮る。'], tip: '鍋にすき間なく並べるとほどけにくいよ。' },
  '鮭のムニエル': { s: ['生鮭 2切れ','塩こしょう 少々','小麦粉 大さじ1','バター 15g','レモン（お好みで）'], p: ['鮭に塩こしょうをふって5分おき、水気をふく。','小麦粉を薄くまぶす。','フライパンにバターを中火で溶かし、皮目から3分、返して3分焼く。','溶けたバターをかけながら仕上げ、レモンを添える。'] },
  'えびとブロッコリーのガーリック炒め': { s: ['むきえび 150g','ブロッコリー 1/2株','にんにく 1かけ','オリーブ油 大さじ1','酒 大さじ1','片栗粉 小さじ1','塩 小さじ1/3','こしょう 少々'], p: ['えびに片栗粉をもみ込んでから水で洗い、水気をふく。','ブロッコリーは小房に分け、レンジで2分加熱する。','オリーブ油で薄切りにんにくを弱火で炒め、香りが出たらえびを炒める。','ブロッコリーと酒を加えて炒め、塩こしょうで味をととのえる。'], tip: 'えびを片栗粉でもむと臭みが取れるよ。' },
  'ベーコンとほうれん草のオムレツ': { s: ['卵 4個','ベーコン 2枚','ほうれん草 1/2束','牛乳 大さじ2','塩こしょう 少々','バター 10g'], p: ['ほうれん草はざく切り、ベーコンは1cm幅に切る。','フライパンでベーコンとほうれん草を炒めて取り出す。','卵・牛乳・塩こしょうを溶き、炒めた具を混ぜる。','バターを熱して卵液を流し、大きく混ぜて半熟になったら半分に折る。'] },
  'ツナとキャベツのペペロンチーノ': { s: ['スパゲッティ 200g','ツナ缶 1缶','キャベツ 3枚','にんにく 1かけ','赤唐辛子 1本','オリーブ油 大さじ2','しょうゆ 小さじ1','塩 適量'], p: ['湯2Lに塩大さじ1を入れ、パスタを表示時間どおりゆでる。ゆで上がる1分前にざく切りキャベツを加える。','フライパンにオリーブ油、薄切りにんにく、唐辛子を入れ、弱火で香りを出す。','ツナとゆで汁大さじ4を加える。','パスタとキャベツを加えて絡め、しょうゆと塩で味をととのえる。'], tip: 'ゆで汁を入れるとソースがなめらかになるよ。' },
  'ツナとじゃがいものグラタン': { s: ['じゃがいも 2個','玉ねぎ 1/2個','ツナ缶 1缶','バター 20g','小麦粉 大さじ2','牛乳 300ml','塩こしょう 少々','ピザ用チーズ 40g'], p: ['じゃがいもは薄切りにし、レンジで4分加熱する。','バターで薄切りの玉ねぎを炒め、小麦粉をふり入れて炒める。','牛乳を少しずつ加えてとろみをつけ、ツナと塩こしょうを加える。','耐熱皿にじゃがいもとソースを入れ、チーズをのせてトースターで10分焼く。'], tip: '牛乳は少しずつ入れるとダマにならないよ。' },
  '回鍋肉': { s: ['豚バラ薄切り 150g','キャベツ 1/4個','ピーマン 2個','にんにく 1かけ','みそ 大さじ1.5','砂糖・酒 各大さじ1','しょうゆ 小さじ1','豆板醤 小さじ1/2（お好みで）','ごま油 小さじ2'], p: ['キャベツはざく切り、ピーマンは乱切り、豚肉は4cm幅に切る。','調味料を混ぜておく。','ごま油でみじん切りのにんにくと豚肉を炒める。','野菜を加えて強火で炒め、合わせた調味料を絡める。'] },
  '肉野菜炒め': { s: ['豚こま肉 150g','キャベツ 2枚','もやし 1/2袋','にんじん 1/4本','ピーマン 1個','鶏がらスープの素 小さじ1','しょうゆ 小さじ1','塩こしょう 少々','ごま油 大さじ1'], p: ['野菜を食べやすく切る。にんじんは細切りにする。','豚肉に塩こしょうをふり、ごま油で炒める。','にんじん、キャベツとピーマン、もやしの順に加えて強火で炒める。','スープの素としょうゆで味をつける。'], tip: '強火で手早く炒めると水っぽくならないよ。' },
  '八宝菜': { s: ['豚こま肉 100g','むきえび 80g','白菜 3枚','にんじん 1/4本','きのこ 1/2パック','水 200ml','鶏がらスープの素 小さじ2','しょうゆ・オイスターソース 各小さじ2','片栗粉 大さじ1（水大さじ2で溶く）','ごま油 大さじ1'], p: ['白菜は軸と葉に分けてそぎ切り、にんじんは短冊切りにする。','ごま油で豚肉とえびを炒め、白菜の軸とにんじん、葉ときのこの順に加えて炒める。','水と調味料を加えて煮立てる。','水溶き片栗粉を回し入れてとろみをつける。'] },
  '鶏むねとブロッコリーの塩炒め': { s: ['鶏むね肉 1枚','ブロッコリー 1/2株','酒 大さじ1','片栗粉 大さじ1','鶏がらスープの素 小さじ1','塩 少々','にんにく 1/2かけ','ごま油 大さじ1'], p: ['鶏肉をそぎ切りにし、酒・塩・片栗粉をもみ込む。','ブロッコリーは小房に分け、レンジで2分加熱する。','ごま油でにんにくを炒め、鶏肉を両面焼く。','ブロッコリー、スープの素、水大さじ2を加えて炒め合わせる。'], tip: '片栗粉をもみ込むと、むね肉がしっとりするよ。' },
  '青椒肉絲': { s: ['牛こま肉 150g','ピーマン 4個','たけのこ水煮（あれば） 50g','オイスターソース 大さじ1','しょうゆ・酒 各小さじ2','砂糖 小さじ1','片栗粉 小さじ2','ごま油 大さじ1'], p: ['牛肉を細切りにし、酒少々と片栗粉をまぶす。','ピーマンとたけのこを細切りにする。','ごま油で牛肉を炒め、色が変わったらピーマンとたけのこを加える。','調味料を加えて全体に絡める。'] },
  '麻婆豆腐': { s: ['絹豆腐 1丁','豚ひき肉 100g','ねぎ 1/2本','にんにく・しょうが（すりおろし） 各小さじ1','豆板醤 小さじ1','甜麺醤（みそでも） 大さじ1','水 150ml','鶏がらスープの素 小さじ1','しょうゆ 小さじ2','片栗粉 小さじ2（水大さじ1で溶く）','ごま油 大さじ1'], p: ['豆腐は2cm角に切り、ねぎはみじん切りにする。','ごま油でにんにく・しょうが・豆板醤を炒め、ひき肉を炒める。','甜麺醤、水、スープの素、しょうゆを加えて煮立て、豆腐を入れて3分煮る。','ねぎを加え、水溶き片栗粉でとろみをつける。'], tip: '子ども用なら豆板醤を抜いて、あとから大人の分だけ足してね。' },
  '麻婆なす': { s: ['なす 3本','豚ひき肉 100g','ねぎ 1/2本','にんにく・しょうが（すりおろし） 各小さじ1','豆板醤 小さじ1/2','みそ 大さじ1','砂糖・しょうゆ 各小さじ2','水 100ml','片栗粉 小さじ2（水大さじ1で溶く）','ごま油 大さじ2'], p: ['なすは乱切り、ねぎはみじん切りにする。','ごま油大さじ1.5でなすを焼いて取り出す。','残りのごま油でにんにく・しょうが・豆板醤を炒め、ひき肉を炒める。','水と調味料を加え、なすを戻してねぎを入れ、水溶き片栗粉でとろみをつける。'] },
  'えびチリ': { s: ['むきえび 200g','ねぎ 1/2本','卵 1個（お好みで）','にんにく・しょうが（すりおろし） 各小さじ1','豆板醤 小さじ1/2','ケチャップ 大さじ3','砂糖 小さじ1','鶏がらスープの素 小さじ1/2','水 100ml','片栗粉 大さじ1＋小さじ1','ごま油 大さじ1'], p: ['えびに片栗粉大さじ1をまぶし、ごま油で焼いて取り出す。卵を使うときは炒り卵にして取り出す。','にんにく・しょうが・豆板醤・みじん切りのねぎを炒める。','ケチャップ・砂糖・水・スープの素を加えて煮立てる。','えびを戻し、片栗粉小さじ1を水で溶いてとろみをつけ、卵を加える。'] },
  '天津飯': { s: ['卵 3個','ねぎ 1/2本','かに風味かまぼこ（あれば） 4本','ごはん 2杯','塩こしょう 少々','ごま油 大さじ1','あん：水 150ml','あん：鶏がらスープの素 小さじ1','あん：しょうゆ・酢・砂糖 各小さじ2','あん：片栗粉 小さじ2'], p: ['卵を溶き、斜め切りのねぎ、ほぐしたかにかま、塩こしょうを混ぜる。','1人分ずつ、ごま油で半熟に焼いてごはんにのせる。','あんの材料を小鍋で混ぜてから火にかけ、混ぜながらとろみをつける。','卵の上からあんをかける。'], tip: 'あんは火にかける前に混ぜておくとダマにならないよ。' },

  'ほうれん草のおひたし': { s: ['ほうれん草 1束','だし汁 大さじ3','しょうゆ 小さじ2','かつお節 少々'], p: ['塩少々を入れた湯に根元から入れ、1分ゆでる。','冷水にとって水気をしぼり、4cmに切る。','だし汁としょうゆであえ、かつお節をのせる。'] },
  'にんじんしりしり': { s: ['にんじん 1本','ツナ缶 1/2缶','卵 1個','しょうゆ 小さじ2','砂糖 小さじ1','ごま油 小さじ2'], p: ['にんじんを細切りにする（スライサーが便利）。','ごま油でにんじんをしんなりするまで炒める。','ツナと調味料を加える。','溶き卵を回し入れて炒め合わせる。'], tip: 'にんじんが苦手な子もツナと卵で食べやすいよ。' },
  'キャベツの塩昆布あえ': { s: ['キャベツ 3枚','塩昆布 大さじ2','ごま油 小さじ2','白ごま 少々'], p: ['キャベツをざく切りにする。','ポリ袋に入れ、塩昆布とごま油を加えてもみ、5分おく。','器に盛って白ごまをふる。'] },
  '大根サラダ': { s: ['大根 5cm','乾燥わかめ 大さじ1','ポン酢 大さじ2','ごま油 小さじ1','かつお節 少々'], p: ['わかめを水で戻す。','大根を細切りにして水にさらし、水気を切る。','大根とわかめを合わせ、ポン酢とごま油をかけてかつお節をのせる。'] },
  '大根と油揚げの煮物': { s: ['大根 1/4本','油揚げ 1枚','だし汁 300ml','しょうゆ・みりん 各大さじ1.5','砂糖 小さじ1'], p: ['大根はいちょう切り、油揚げは短冊切りにする。','鍋にだし汁と大根を入れ、やわらかくなるまで10分煮る。','油揚げと調味料を入れて8分煮る。'] },
  'なすの揚げびたし': { s: ['なす 3本','めんつゆ（3倍濃縮） 大さじ3','水 大さじ6','しょうが（すりおろし） 少々','揚げ油 適量'], p: ['なすを縦半分に切り、皮に格子の切れ目を入れて食べやすく切る。','めんつゆと水を合わせておく。','170℃の油で2〜3分揚げる（多めの油で揚げ焼きでもOK）。','熱いうちにつゆにひたし、しょうがをのせる。'], tip: '冷やしてもおいしいよ。' },
  'きゅうりの浅漬け': { s: ['きゅうり 2本','塩 小さじ1/2','昆布（2cm角） 1枚','赤唐辛子 少々'], p: ['きゅうりを乱切りにする。','ポリ袋に塩・昆布・唐辛子と一緒に入れてもむ。','冷蔵庫で15分以上おく。'], tip: '漬けておく時間は調理時間に入れていないよ。' },
  'きゅうりとわかめの酢の物': { s: ['きゅうり 1本','乾燥わかめ 大さじ1','塩 少々','酢 大さじ2','砂糖 大さじ1','しょうゆ 少々'], p: ['きゅうりを薄切りにして塩もみし、5分おいて水気をしぼる。','わかめを水で戻す。','合わせ酢であえる。'] },
  'かぼちゃの煮物': { s: ['かぼちゃ 1/4個','水 200ml','砂糖 大さじ1.5','しょうゆ・みりん 各大さじ1'], p: ['種とわたを取って一口大に切り、ところどころ皮をむく。','皮を下にして鍋に並べ、水と調味料を入れる。','落としぶたをして12分、汁が少なくなるまで煮る。'], tip: '皮を下にすると煮くずれしにくいよ。' },
  'ブロッコリーのごまあえ': { s: ['ブロッコリー 1/2株','すりごま 大さじ2','しょうゆ・砂糖 各小さじ2'], p: ['小房に分けて塩ゆでを2分する。','水気をよく切る。','すりごま・しょうゆ・砂糖であえる。'] },
  'きのこのバター醤油炒め': { s: ['きのこ 2パック（しめじ・エリンギなど）','バター 10g','しょうゆ 小さじ2','こしょう 少々'], p: ['石づきを取ってほぐす。','バターで炒める。','しんなりしたらしょうゆを回し入れ、こしょうをふる。'] },
  '白菜の浅漬け': { s: ['白菜 1/8株','塩 小さじ1','昆布（2cm角） 1枚','ゆずの皮（あれば） 少々'], p: ['白菜をざく切りにする。','ポリ袋に塩・昆布と一緒に入れてもむ。','重しをして冷蔵庫で30分おき、水気をしぼる。'], tip: '漬けておく時間は調理時間に入れていないよ。' },
  '冷ややっこ': { s: ['豆腐 1丁','ねぎ 少々','しょうが（すりおろし） 少々','かつお節 少々','しょうゆ 適量'], p: ['豆腐の水気を切って半分に切る。','ねぎを小口切りにする。','薬味をのせ、しょうゆをかける。'] },
  'だし巻き卵': { s: ['卵 3個','だし汁 大さじ3','砂糖 小さじ1','しょうゆ・塩 少々','サラダ油 適量'], p: ['材料をすべて混ぜる。','卵焼き器に油をひき、1/3量を流して半熟のうちに奥から手前へ巻く。','巻いた卵を奥に移して油をひき、残りを流して巻くのを繰り返す。','熱いうちにペーパーや巻きすで形を整える。'] },
  'ほうれん草とベーコンのソテー': { s: ['ほうれん草 1束','ベーコン 2枚','バター 10g','塩こしょう 少々'], p: ['ほうれん草は4cm、ベーコンは1cm幅に切る。','バターでベーコンを炒める。','ほうれん草の茎、葉の順に加えて炒め、塩こしょうで味をととのえる。'] },
  'ポテトサラダ': { s: ['じゃがいも 2個','きゅうり 1/2本','にんじん 1/4本','卵 1個','マヨネーズ 大さじ3','酢 小さじ1','塩こしょう 少々'], p: ['じゃがいもとにんじんを一口大に切り、やわらかくゆでる（レンジで6分でもOK）。卵はゆで卵にする。','じゃがいもが熱いうちにつぶし、酢と塩こしょうを混ぜる。','きゅうりを薄切りにして塩もみし、水気をしぼる。','冷めたらゆで卵、きゅうり、マヨネーズであえる。'], tip: '熱いうちに酢を混ぜると味がぼやけないよ。' },
  'ジャーマンポテト': { s: ['じゃがいも 2個','ベーコン 2枚','玉ねぎ 1/4個','オリーブ油 大さじ1','塩こしょう 少々','粒マスタード（お好みで）'], p: ['じゃがいもをくし形に切り、レンジで4分加熱する。','ベーコンは1cm幅、玉ねぎは薄切りにする。','オリーブ油でじゃがいもに焼き色をつけ、ベーコンと玉ねぎを加えて炒める。','塩こしょうで味をととのえる。'] },
  'コールスロー': { s: ['キャベツ 3枚','にんじん 1/4本','塩 小さじ1/3','マヨネーズ 大さじ2','酢 小さじ2','砂糖 小さじ1'], p: ['キャベツとにんじんをせん切りにする。','塩をふってもみ、5分おいて水気をしぼる。','調味料であえる。'] },
  'トマトと玉ねぎのサラダ': { s: ['トマト 2個','玉ねぎ 1/4個','オリーブ油 大さじ1','酢 小さじ2','塩・こしょう 少々'], p: ['玉ねぎを薄切りにして水にさらし、水気を切る。','トマトをくし形に切る。','器に盛り、調味料を混ぜたドレッシングをかける。'] },

const SLOTS = [
  { key: 'main', label: '主菜' },
  { key: 'side', label: '副菜' },
  { key: 'soup', label: '汁物' },
];
const STORE_KEY = 'kondate-checked';
const TIME_KEY = 'kondate-time';
const GENRE_KEY = 'kondate-genre';
// 0 = こだわらない。各料理の目安時間がこの分数以内のものだけ選ぶ
const TIME_LIMITS = [0, 30, 20, 15, 10];
const GENRES = [
  { key: 'any', label: 'こだわらない' },
  { key: 'wa', label: '和食' },
  { key: 'yo', label: '洋食' },
  { key: 'ch', label: '中華' },
];
const GENRE_LABEL = { wa: '和食', yo: '洋食', ch: '中華' };
const ALL_ITEMS = GROUPS.flatMap(g => g.items);

const pantry = document.getElementById('pantry');
const tray = document.getElementById('tray');
const note = document.getElementById('note');
const modeText = document.getElementById('modeText');
let menu = {};

function loadChecked() {
  try { return new Set(JSON.parse(localStorage.getItem(STORE_KEY) || '[]')); } catch (e) { return new Set(); }
}
function saveChecked(set) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify([...set])); } catch (e) {}
}
function loadTime() {
  try { const v = Number(localStorage.getItem(TIME_KEY)); return TIME_LIMITS.includes(v) ? v : 0; } catch (e) { return 0; }
}
function saveTime(v) {
  try { localStorage.setItem(TIME_KEY, String(v)); } catch (e) {}
}
function checked() {
  return new Set([...pantry.querySelectorAll('.chip input:checked')].map(el => el.value));
}
function loadGenre() {
  try { const v = localStorage.getItem(GENRE_KEY); return GENRES.some(g => g.key === v) ? v : 'any'; } catch (e) { return 'any'; }
}
function saveGenre(v) {
  try { localStorage.setItem(GENRE_KEY, v); } catch (e) {}
}
function timeLimit() {
  const el = pantry.querySelector('input[name="time"]:checked');
  return el ? Number(el.value) : 0;
}
function genre() {
  const el = pantry.querySelector('input[name="genre"]:checked');
  return el ? el.value : 'any';
}
const rand = arr => arr[Math.floor(Math.random() * arr.length)];
const countIn = (dish, set) => dish.i.filter(x => set.has(x)).length;
// 条件に合う料理だけ：時間・ジャンル、食材を選んでいればそのどれかを使うもの
function poolFor(slot) {
  const limit = timeLimit();
  const g = genre();
  const selected = checked();
  return DISHES.filter(d => d.t === slot
    && (!limit || d.m <= limit)
    && (g === 'any' || d.g === g)
    && (!selected.size || countIn(d, selected) > 0));
}

function renderPantry() {
  const saved = loadChecked();
  const savedTime = loadTime();
  const savedGenre = loadGenre();
  pantry.innerHTML = `
    <div class="group">
      <h2>ジャンル</h2>
      <div class="times" role="radiogroup" aria-label="ジャンル">
        ${GENRES.map(g => `<span class="time"><input type="radio" name="genre" id="genre-${g.key}" value="${g.key}"${g.key === savedGenre ? ' checked' : ''}><label for="genre-${g.key}">${g.label}</label></span>`).join('')}
      </div>
    </div>
    <div class="group">
      <h2>調理時間（1品あたり）</h2>
      <div class="times" role="radiogroup" aria-label="調理時間">
        ${TIME_LIMITS.map(v => `<span class="time"><input type="radio" name="time" id="time-${v}" value="${v}"${v === savedTime ? ' checked' : ''}><label for="time-${v}">${v ? v + '分以内' : 'こだわらない'}</label></span>`).join('')}
      </div>
    </div>` + GROUPS.map(g => `
    <div class="group">
      <h2>${g.name}</h2>
      <div class="chips">
        ${g.items.map(item => {
          const id = 'ing-' + ALL_ITEMS.indexOf(item);
          return `<span class="chip"><input type="checkbox" id="${id}" value="${item}"${saved.has(item) ? ' checked' : ''}><label for="${id}">${item}</label></span>`;
        }).join('')}
      </div>
    </div>`).join('') + `
    <div class="pantry-foot"><span id="count"></span><button class="link" id="clear" type="button">チェックをすべてはずす</button></div>`;
}

// 選んだ食材のうち、まだ使っていないものを多く使う料理を優先する
function score(dish, selected, remaining) {
  return countIn(dish, remaining) * 10 + countIn(dish, selected);
}

function pickBest(slot, selected, remaining) {
  const pool = poolFor(slot);
  if (!pool.length) return null;
  if (selected.size === 0) return rand(pool);
  const scored = pool.map(d => ({ d, s: score(d, selected, remaining) }));
  const best = Math.max(...scored.map(x => x.s));
  return rand(scored.filter(x => x.s === best).map(x => x.d));
}
const pickedDishes = () => SLOTS.map(s => menu[s.key]).filter(Boolean);

function suggest() {
  const selected = checked();
  const remaining = new Set(selected);
  menu = {};
  for (const { key } of SLOTS) {
    const dish = pickBest(key, selected, remaining);
    menu[key] = dish;
    if (dish) dish.i.forEach(x => remaining.delete(x));
  }
  render(true);
}

// 入れ替え：条件に合う料理から選び直す。ほかの品で使っていない食材を使うものを優先
function swap(slot) {
  const selected = checked();
  const others = new Set(SLOTS.filter(s => s.key !== slot && menu[s.key]).flatMap(s => menu[s.key].i));
  const remaining = new Set([...selected].filter(x => !others.has(x)));
  const pool = poolFor(slot).filter(d => d !== menu[slot]);
  if (!pool.length) return;
  const useRemaining = pool.filter(d => countIn(d, remaining) > 0);
  menu[slot] = rand(useRemaining.length ? useRemaining : pool);
  render(false);
}

// 献立君のひとこと
function kunSay(selected, leftover, limit, g) {
  const dishes = pickedDishes();
  if (!dishes.length) return '条件に合う料理が見つからなかったよ…。食材を増やすか、ジャンルや時間を「こだわらない」にしてみてね。';
  const main = dishes[0].n;
  if (dishes.length < SLOTS.length) {
    const missing = SLOTS.filter(s => !menu[s.key]).map(s => s.label).join('と');
    return `${missing}は条件に合うものがなかったよ。今日は${main}でどう？`;
  }
  if (selected.size && !leftover.length) {
    return rand([`チェックした食材、ぜんぶ使えたよ！主菜は${main}だよ。`, `${main}で冷蔵庫すっきり！がんばって作ってね。`]);
  }
  if (selected.size) {
    return `${leftover.join('、')}も使いたかったなあ…。入れ替えボタンで探してみてね。`;
  }
  if (limit && limit <= 15) return `${limit}分以内のさっと作れる献立にしたよ。今日は${main}でどう？`;
  if (g !== 'any') return `${GENRE_LABEL[g]}の気分なんだね。${main}がおすすめだよ！`;
  return rand([`今日は${main}なんてどう？`, `迷ったらぼくにおまかせ！${main}にしてみたよ。`, `冷蔵庫の食材を選んでくれたら、それで考えるよ。今日は${main}はどう？`]);
}

function render(animate) {
  const selected = checked();
  const used = new Set(pickedDishes().flatMap(d => d.i));
  const leftover = [...selected].filter(x => !used.has(x));

  document.getElementById('count').textContent = selected.size ? `${selected.size}品えらび中` : 'まだ何も選んでいません';
  const limit = timeLimit();
  const g = genre();
  const conds = [g !== 'any' ? GENRE_LABEL[g] : '', limit ? `${limit}分以内` : ''].filter(Boolean);
  const limitText = conds.length ? `${conds.join('・')}の条件で選んでいます。` : '';
  modeText.innerHTML = selected.size
    ? `えらんだ食材から提案<small>${limitText}チェックした食材をなるべく使う組み合わせです</small>`
    : `おまかせで提案<small>${limitText}食材にチェックすると、それを使う献立に変わります</small>`;

  tray.innerHTML = SLOTS.map(({ key, label }) => {
    const d = menu[key];
    if (!d) return `
      <article class="dish empty">
        <div class="dish-head">
          <span class="slot">${label}</span>
          <span class="empty-text">条件に合う${label}がありません</span>
        </div>
      </article>`;
    return `
      <article class="dish" data-recipe="${d.n}">
        <div class="dish-head">
          <span class="slot">${label}</span>
          <button class="dish-link" type="button" data-recipe="${d.n}">${d.n}</button>
          <span class="mins">${GENRE_LABEL[d.g]}・約${d.m}分</span>
        </div>
        <button class="swap" type="button" data-slot="${key}" aria-label="${label}を入れ替える"${poolFor(key).length > 1 ? '' : ' disabled title="この条件で作れる料理はこれだけです"'}>入れ替え</button>
        <div class="ings">${d.i.map(x => `<span class="ing${selected.has(x) ? ' hit' : ''}">${x}</span>`).join('')}</div>
      </article>`;
  }).join('');

  document.getElementById('kunText').textContent = kunSay(selected, leftover, limit, g);
  if (animate) {
    const kun = document.getElementById('kunSvg');
    [tray, kun].forEach(el => el.classList.remove(el === tray ? 'pop' : 'hop'));
    void tray.offsetWidth;
    tray.classList.add('pop');
    kun.classList.add('hop');
  }

  const dishes = pickedDishes();
  const total = dishes.length ? Math.max(...dishes.map(d => d.m)) : 0;
  const timeText = `いちばん時間がかかるのは約${total}分の料理です。`;
  const loosen = [selected.size ? '食材を増やす' : '', conds.length ? 'ジャンルや調理時間を「こだわらない」にする' : ''].filter(Boolean).join('か、');
  if (dishes.length < SLOTS.length) {
    note.innerHTML = `条件に合う料理がない品は表示していません。${loosen ? loosen + 'と、候補が増えます。' : ''}`;
  } else if (!selected.size) {
    note.innerHTML = timeText;
  } else if (leftover.length) {
    note.innerHTML = `<b>${leftover.join('、')}</b> はこの献立では使っていません。入れ替えると使う料理が出てくることがあります。`;
  } else {
    note.innerHTML = `<b>チェックした食材をすべて使えます。</b>${timeText}`;
  }
}

// タイトル横の献立君（同じ絵を小さく使う）
const headKun = document.getElementById('kunSvg').cloneNode(true);
headKun.removeAttribute('id');
headKun.setAttribute('aria-hidden', 'true');
document.getElementById('headKun').append(headKun);

renderPantry();
suggest();

pantry.addEventListener('change', () => { saveChecked(checked()); saveTime(timeLimit()); saveGenre(genre()); suggest(); });
pantry.addEventListener('click', e => {
  if (e.target.id !== 'clear') return;
  pantry.querySelectorAll('.chip input:checked').forEach(el => { el.checked = false; });
  saveChecked(new Set());
  suggest();
});
document.getElementById('again').addEventListener('click', suggest);
tray.addEventListener('click', e => {
  const btn = e.target.closest('.swap');
  if (btn) { swap(btn.dataset.slot); return; }
  // カードのどこを押しても作り方へ（入れ替えボタン以外）
  const card = e.target.closest('.dish');
  if (card) openRecipe(card.dataset.recipe);
});

// 作り方ページ
const homeView = document.getElementById('homeView');
const recipeView = document.getElementById('recipeView');
let homeScroll = 0;

// 材料の行が、チェックした食材を含むか（「豚肉」→「豚こま肉」など）
function hasItem(line, item) {
  if (item === 'ねぎ') return line.includes('ねぎ') && !line.includes('玉ねぎ');
  if (['豚肉', '鶏肉', '牛肉'].includes(item)) return line.startsWith(item[0]) && line.includes('肉');
  if (item === 'ツナ缶') return line.includes('ツナ');
  if (item === 'きのこ') return line.includes('きのこ') || line.includes('しめじ');
  return line.includes(item);
}

function openRecipe(name) {
  const d = DISHES.find(x => x.n === name);
  const r = RECIPES[name];
  if (!d || !r) return;
  const selected = checked();
  const slot = SLOTS.find(s => s.key === d.t).label;
  const q = encodeURIComponent(name);
  const stuff = r.s.map(line => {
    const at = line.lastIndexOf(' ');
    const nm = at > 0 ? line.slice(0, at) : line;
    const qty = at > 0 ? line.slice(at + 1) : '';
    const have = [...selected].some(item => hasItem(nm, item));
    return `<li${have ? ' class="have"' : ''}><span class="name">${nm}</span><span class="qty">${qty}</span></li>`;
  }).join('');

  recipeView.innerHTML = `
    <div><button type="button" id="back">← 献立にもどる</button></div>
    <div class="recipe-top">
      <div class="recipe-meta"><span class="slot">${slot}</span><span>${GENRE_LABEL[d.g]}・約${d.m}分・2人分</span></div>
      <h2>${name}</h2>
    </div>
    <div class="recipe-body">
      <section class="stuff">
        <h3>材料（2人分）</h3>
        <ul>${stuff}</ul>
      </section>
      <section class="steps">
        <h3>作り方</h3>
        <ol>${r.p.map(step => `<li><p>${step}</p></li>`).join('')}</ol>
      </section>
    </div>
    <div class="kun" id="recipeKun">
      <div class="bubble">
        <div class="bubble-name">献立君のひとこと</div>
        <p class="bubble-text">${r.tip || 'おいしくできますように！できたら献立にもどって、ほかの料理も見てね。'}</p>
      </div>
    </div>
    <div class="more">ほかの作り方も見てみる：
      <a href="https://www.kurashiru.com/search?query=${q}" target="_blank" rel="noopener">クラシル</a>
      <a href="https://cookpad.com/jp/search/${q}" target="_blank" rel="noopener">クックパッド</a>
    </div>`;

  const kun = document.getElementById('kunSvg').cloneNode(true);
  kun.removeAttribute('id');
  kun.classList.remove('hop');
  document.getElementById('recipeKun').prepend(kun);

  homeScroll = window.scrollY;
  homeView.hidden = true;
  recipeView.hidden = false;
  window.scrollTo(0, 0);
  document.getElementById('back').focus({ preventScroll: true });
}

function closeRecipe() {
  recipeView.hidden = true;
  homeView.hidden = false;
  window.scrollTo(0, homeScroll);
}

recipeView.addEventListener('click', e => {
  if (e.target.id === 'back') closeRecipe();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !recipeView.hidden) closeRecipe();
});
</script>
</body>
</html>
